<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 478" width="880" height="478" role="img" aria-label="Animated demo: php2shell-check scanning a Linux host and reporting a vulnerable PHP-FPM, a back-ported patch and a stale worker">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
</defs>
<rect width="880" height="478" rx="12" fill="url(#bg)" stroke="#30363d"/>
<rect width="880" height="36" rx="12" fill="#1c2128"/><rect y="24" width="880" height="12" fill="#1c2128"/>
<line x1="0" y1="36" x2="880" y2="36" stroke="#30363d"/>
<circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
<text x="440.0" y="23" text-anchor="middle" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12">root@web-01: ~</text>
<rect width="0" height="0"><animate id="clock" attributeName="width" from="0" to="0" dur="16s" begin="0s;clock.end"/></rect>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14">
<clipPath id="c0"><rect x="22" y="54" height="21" width="18"><set attributeName="width" to="18" begin="clock.begin"/><animate attributeName="width" from="18" to="207" dur="1.32s" begin="clock.begin+0.4s" fill="freeze" calcMode="discrete" values="18;27;35;44;52;61;70;78;87;95;104;113;121;130;138;147;156;164;173;181;190;199;207"/></rect></clipPath><g clip-path="url(#c0)" opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+0.10000000000000003s"/><text x="22" y="70" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#f0f6fc">sudo php2shell-check</tspan></text></g>
<rect y="56" width="8" height="17" fill="#c9d1d9" opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+0.10000000000000003s"/><set attributeName="opacity" to="0" begin="clock.begin+2.22s"/><animate attributeName="x" calcMode="discrete" dur="1.32s" begin="clock.begin+0.4s" fill="freeze" values="40;49;57;66;74;83;92;100;109;117;126;135;143;152;160;169;178;186;195;203;212;221;229"/><set attributeName="x" to="40" begin="clock.begin"/></rect>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+2.3s"/><text x="22" y="91" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">php2shell-check 1.0.0</tspan><tspan fill="#c9d1d9"> - PHP2Shell (CVE-2026-109618, CVE-2026-109619)</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+2.4s"/><text x="22" y="112" xml:space="preserve"><tspan fill="#7d8590">Fixed in: 8.2.35, 8.3.36, 8.4.27, 8.5.12</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+2.5s"/><text x="22" y="133" xml:space="preserve"><tspan fill="#c9d1d9"></tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+4.2s"/><text x="22" y="154" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">host (linux/amd64)</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+4.6s"/><text x="22" y="175" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#ff7b72" font-weight="700">VULNERABLE      </tspan><tspan fill="#c9d1d9"> fpm   8.4.10                 /usr/sbin/php-fpm8.4</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+4.8s"/><text x="22" y="196" xml:space="preserve"><tspan fill="#7d8590">      why: </tspan><tspan fill="#c9d1d9">8.4.10 &lt; 8.4.27</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+5.0s"/><text x="22" y="217" xml:space="preserve"><tspan fill="#7d8590">      do:  </tspan><tspan fill="#c9d1d9">Upgrade PHP 8.4 to 8.4.27 or later</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+5.2s"/><text x="22" y="238" xml:space="preserve"><tspan fill="#7d8590">      do:  </tspan><tspan fill="#c9d1d9">Restart PHP-FPM / web server workers afterwards</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+5.8s"/><text x="22" y="259" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950">PATCHED_BACKPORT</tspan><tspan fill="#c9d1d9"> cli   8.3.6                  /usr/bin/php8.3</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+6.3s"/><text x="22" y="280" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#3fb950">PATCHED         </tspan><tspan fill="#c9d1d9"> fpm   8.5.12                 /opt/remi/php85/root/usr/sbin/php-fpm</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+6.9s"/><text x="22" y="301" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">RESTART REQUIRED:</tspan><tspan fill="#c9d1d9"> 1 running process still uses a replaced PHP binary</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+7.1s"/><text x="22" y="322" xml:space="preserve"><tspan fill="#7d8590">      pid 1123    php-fpm8.4     /usr/sbin/php-fpm8.4 </tspan><tspan fill="#ff7b72">(deleted)</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+7.2s"/><text x="22" y="343" xml:space="preserve"><tspan fill="#c9d1d9"></tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+7.9s"/><text x="22" y="364" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">Result: </tspan><tspan fill="#ff7b72" font-weight="700">VULNERABLE</tspan><tspan fill="#c9d1d9">  (1 vulnerable, 1 patched, 1 patched_backport, 1 stale process)</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+8.1s"/><text x="22" y="385" xml:space="preserve"><tspan fill="#c9d1d9">Patch now, then restart PHP workers.</tspan></text></g>
<clipPath id="c16"><rect x="22" y="390" height="21" width="18"><set attributeName="width" to="18" begin="clock.begin"/><animate attributeName="width" from="18" to="95" dur="0.54s" begin="clock.begin+8.4s" fill="freeze" calcMode="discrete" values="18;27;35;44;52;61;70;78;87;95"/></rect></clipPath><g clip-path="url(#c16)" opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+8.1s"/><text x="22" y="406" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#f0f6fc">echo $?</tspan></text></g>
<rect y="392" width="8" height="17" fill="#c9d1d9" opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+8.1s"/><set attributeName="opacity" to="0" begin="clock.begin+9.440000000000001s"/><animate attributeName="x" calcMode="discrete" dur="0.54s" begin="clock.begin+8.4s" fill="freeze" values="40;49;57;66;74;83;92;100;109;117"/><set attributeName="x" to="40" begin="clock.begin"/></rect>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+9.4s"/><text x="22" y="427" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">1</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="0" begin="clock.begin"/><set attributeName="opacity" to="1" begin="clock.begin+2.6s"/><set attributeName="opacity" to="0" begin="clock.begin+4.2s"/><text x="22" y="154" fill="#79c0ff"><tspan>scanning: discovering PHP, reading dpkg/rpm changelogs, checking /proc</tspan><tspan><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/> ...</tspan></text></g>
</g>
</svg>
