name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"] # full versions only; the moving major tag (v1) must not release
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Real cross-platform verification: tests run natively on all three OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Smoke test (scan the runner itself)
        shell: bash
        run: |
          go run ./cmd/php2shell-check --no-color || code=$?
          # 0 safe, 1 vulnerable, 2 attention are all valid outcomes on a CI image.
          [ "${code:-0}" -le 2 ]

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  image-scan:
    # Exercises the container path against real official images.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Scan official images
        run: |
          go build -o p2s ./cmd/php2shell-check
          ./p2s image php:8.3-fpm php:8.4-fpm-alpine php:7.4-fpm --no-color || code=$?
          # 7.4 is end-of-life, so this must report vulnerable (exit 1).
          [ "${code:-0}" -eq 1 ]
      - name: Scan an Apache mod_php image
        run: |
          ./p2s image php:8.4-apache --json > apache.json || true
          # The module must be found and versioned, never skipped.
          jq -e '[.targets[0].installations[] | select(.sapi == "apache" and .version != null)] | length == 1' apache.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist VERSION=${GITHUB_REF_NAME#v}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

  release-smoke:
    # Run the binaries just published on every OS, each against a real PHP.
    needs: release
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}
